enum SplitType {
    Personal
    Shared
    Custom
  }

  enum ExpenseFlow {
    Outgoing
    Incoming
  }

  enum SettlementPeriod {
    CurrentMonth
    Last6Months
    Last12Months
  }

  type Expense {
    id: ID!
    title: String!
    amount: Float!
    currency: String!
    createdAt: String!
    transactionDate: String!
    category: String!
    expenseGroup: String
    split: SplitType!
    splitDetails: [SplitAllocation!]!
    groupId: ID
    createdByUserId: ID
    paidByUserId: ID
    isPrivate: Boolean!
    flow: ExpenseFlow!
  }

  type SplitAllocation {
    participant: String!
    ratio: Float!
    amount: Float!
  }

  type GroupMember {
    userId: ID
    name: String!
    email: String!
    ratio: Float!
  }

  type GroupExpense {
    date: String!
    expenseGroup: String
    category: String!
    description: String!
    paidBy: String!
    total: Float!
    yourShare: Float!
    isPrivate: Boolean!
    currency: String!
  }

  type Group {
    id: ID!
    name: String!
    description: String
    members: [GroupMember!]!
    totalSpent: Float!
    yourShare: Float!
    expenses: [GroupExpense!]!
    """Expense group names from split templates (may exist before any expense is posted)."""
    expenseGroupLabels: [String!]!
    """Pending invitees without accounts yet (for the current viewer's households)."""
    pendingInvitations: [GroupPendingInvitation!]!
  }

  type GroupPendingInvitation {
    email: String!
    name: String!
    status: GroupInvitationStatus!
    emailDeliveryStatus: InvitationEmailDeliveryStatus
  }

  enum GroupInvitationStatus {
    Pending
    Accepted
    Declined
  }

  enum InvitationEmailDeliveryStatus {
    PendingEmail
    EmailSent
    EmailFailed
    EmailSkipped
  }

  type GroupInvitation {
    id: ID!
    groupId: ID!
    groupName: String!
    email: String!
    status: GroupInvitationStatus!
    emailDeliveryStatus: InvitationEmailDeliveryStatus
    invitedAt: String!
    acceptedAt: String
  }

  type SplitTemplate {
    id: ID!
    groupId: ID!
    category: String!
    templateName: String!
    splitDetails: [SplitAllocation!]!
  }

  type SettlementBalance {
    memberName: String!
    amount: Float!
  }

  type SettlementTransfer {
    fromMember: String!
    toMember: String!
    amount: Float!
  }

  type ExpenseGroupSettlement {
    expenseGroup: String!
    totalExpenses: Float!
    balances: [SettlementBalance!]!
    transfers: [SettlementTransfer!]!
  }

  """Settlement totals for one ISO 4217 currency within a household."""
  type CurrencySettlementScope {
    currency: String!
    totalExpenses: Float!
    balances: [SettlementBalance!]!
    transfers: [SettlementTransfer!]!
    expenseGroups: [ExpenseGroupSettlement!]!
  }

  type SettlementPayment {
    id: ID!
    groupId: ID!
    expenseGroup: String
    fromMember: String!
    toMember: String!
    amount: Float!
    note: String
    settledAt: String!
  }

  type RecordSettlementPaymentPayload {
    payment: SettlementPayment!
    householdSettlement: HouseholdSettlement!
  }

  type HouseholdSettlement {
    groupId: ID!
    groupName: String!
    balances: [SettlementBalance!]!
    transfers: [SettlementTransfer!]!
    expenseGroups: [ExpenseGroupSettlement!]!
    payments: [SettlementPayment!]!
    """True when period expenses use more than one currency; use currencyScopes for accurate totals."""
    mixedCurrencyWarning: Boolean!
    currencyScopes: [CurrencySettlementScope!]!
  }

  type User {
    id: ID!
    email: String!
    fullName: String!
    createdAt: String!
  }

  type AuthPayload {
    user: User!
  }

  input SplitAllocationInput {
    participant: String!
    ratio: Float!
  }

  input GroupMemberInput {
    name: String!
    email: String!
    ratio: Float!
  }

  input CreateGroupInput {
    name: String!
    description: String
    members: [GroupMemberInput!]!
  }

  input UpdateGroupInput {
    id: ID!
    name: String!
    description: String
    members: [GroupMemberInput!]!
  }

  input RegisterInput {
    email: String!
    password: String!
    fullName: String!
  }

  input LoginInput {
    email: String!
    password: String!
    rememberMe: Boolean
  }

  input ChangePasswordInput {
    currentPassword: String!
    newPassword: String!
  }

  input RefreshSessionInput {
    refreshToken: String
  }

  input UpsertSplitTemplateInput {
    groupId: ID!
    category: String!
    templateName: String!
    splitDetails: [SplitAllocationInput!]!
  }

  input AddExpenseInput {
    title: String!
    amount: Float!
    transactionDate: String!
    category: String!
    expenseGroup: String
    split: SplitType!
    splitDetails: [SplitAllocationInput!]
    groupId: ID
    paidByUserId: ID
    isPrivate: Boolean
    currency: String
    flow: ExpenseFlow
  }

  input ImportExpenseRowInput {
    clientRowId: ID!
    title: String!
    amount: Float!
    transactionDate: String!
    category: String!
    expenseGroup: String
    split: SplitType!
    splitDetails: [SplitAllocationInput!]
    groupId: ID
    paidByUserId: ID
    isPrivate: Boolean
    currency: String
    flow: ExpenseFlow
  }

  input ImportExpensesInput {
    rows: [ImportExpenseRowInput!]!
  }

  type ImportExpenseRowResult {
    clientRowId: ID!
    success: Boolean!
    expense: Expense
    errorCode: String
    errorMessage: String
  }

  type ImportExpensesPayload {
    results: [ImportExpenseRowResult!]!
    importedCount: Int!
    failedCount: Int!
  }

  input RecordSettlementPaymentInput {
    groupId: ID!
    expenseGroup: String
    fromMember: String!
    toMember: String!
    amount: Float!
    note: String
    settledAt: String!
  }

  input DeleteExpenseInput {
    id: ID!
  }

  input UpdateExpenseInput {
    id: ID!
    title: String!
    amount: Float!
    transactionDate: String!
    category: String!
    expenseGroup: String
    split: SplitType!
    splitDetails: [SplitAllocationInput!]
    groupId: ID
    paidByUserId: ID
    isPrivate: Boolean
    currency: String
    flow: ExpenseFlow
  }

  type BudgetAssumptions {
    startingBalance: Float!
    monthlyIncomeEstimate: Float!
  }

  type MonthCategoryBudgetEntry {
    category: String!
    amount: Float!
  }

  type ImportMerchantRuleSetting {
    id: ID!
    flow: String!
    matchType: String!
    pattern: String!
    category: String!
    split: String
    groupId: String
    expenseGroup: String
    updatedAt: String!
  }

  type SavedColumnMappingSetting {
    signature: String!
    dateIndex: Int!
    merchantIndex: Int!
    amountIndex: Int!
    currencyIndex: Int
    descriptionIndex: Int
    dateHeaderKey: String
    merchantHeaderKey: String
    amountHeaderKey: String
    currencyHeaderKey: String
    descriptionHeaderKey: String
  }

  type UserWorkspaceSettings {
    budgetAssumptions: BudgetAssumptions!
    monthCategoryBudgets: [MonthCategoryBudgetEntry!]!
    importMerchantRules: [ImportMerchantRuleSetting!]!
    importColumnMappings: [SavedColumnMappingSetting!]!
    importCustomCategories: [String!]!
  }

  input BudgetAssumptionsInput {
    startingBalance: Float!
    monthlyIncomeEstimate: Float!
  }

  input MonthCategoryBudgetEntryInput {
    category: String!
    amount: Float!
  }

  input SaveMonthCategoryBudgetsInput {
    yearMonth: String!
    budgets: [MonthCategoryBudgetEntryInput!]!
  }

  input ImportMerchantRuleSettingInput {
    id: ID!
    flow: String!
    matchType: String!
    pattern: String!
    category: String!
    split: String
    groupId: String
    expenseGroup: String
    updatedAt: String!
  }

  input SavedColumnMappingSettingInput {
    signature: String!
    dateIndex: Int!
    merchantIndex: Int!
    amountIndex: Int!
    currencyIndex: Int
    descriptionIndex: Int
    dateHeaderKey: String
    merchantHeaderKey: String
    amountHeaderKey: String
    currencyHeaderKey: String
    descriptionHeaderKey: String
  }

  input SaveUserWorkspaceSettingsInput {
    budgetAssumptions: BudgetAssumptionsInput
    monthCategoryBudgets: SaveMonthCategoryBudgetsInput
    importMerchantRules: [ImportMerchantRuleSettingInput!]
    importColumnMappings: [SavedColumnMappingSettingInput!]
    importCustomCategories: [String!]
  }

  type Query {
    hello: String!
    me: User
    expenses: [Expense!]!
    groups: [Group!]!
    myInvitations: [GroupInvitation!]!
    groupSplitTemplates(groupId: ID!): [SplitTemplate!]!
    householdSettlements(period: SettlementPeriod): [HouseholdSettlement!]!
    userWorkspaceSettings(yearMonth: String!): UserWorkspaceSettings!
    """Multiplier to convert one unit of \`from\` into \`to\` (e.g. EUR→DKK)."""
    fxRate(from: String!, to: String!): Float!
  }

  type Mutation {
    addExpense(input: AddExpenseInput!): Expense!
    importExpenses(input: ImportExpensesInput!): ImportExpensesPayload!
    deleteExpense(input: DeleteExpenseInput!): Boolean!
    updateExpense(input: UpdateExpenseInput!): Expense
    createGroup(input: CreateGroupInput!): Group!
    updateGroup(input: UpdateGroupInput!): Group!
    register(input: RegisterInput!): AuthPayload!
    login(input: LoginInput!): AuthPayload!
    refreshSession(input: RefreshSessionInput!): AuthPayload!
    logout: Boolean!
    logoutAllDevices: Boolean!
    changePassword(input: ChangePasswordInput!): AuthPayload!
    upsertGroupSplitTemplate(input: UpsertSplitTemplateInput!): Group!
    recordSettlementPayment(
      input: RecordSettlementPaymentInput!
      period: SettlementPeriod
    ): RecordSettlementPaymentPayload!
    acceptGroupInvitation(id: ID!): GroupInvitation!
    declineGroupInvitation(id: ID!): GroupInvitation!
    resendGroupInvitation(groupId: ID!, email: String!): GroupPendingInvitation!
    declineExpenseGroupParticipation(groupId: ID!, category: String!): Group!
    deleteExpenseGroup(groupId: ID!, category: String!): Group!
    saveUserWorkspaceSettings(input: SaveUserWorkspaceSettingsInput!): UserWorkspaceSettings!
  }
