name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Client install and build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Server install and build
        working-directory: server
        run: |
          npm ci
          npm run build
