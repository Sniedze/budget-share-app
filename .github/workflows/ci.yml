name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Client install and build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Server install and build
        working-directory: server
        run: |
          npm ci
          npm run build

  server-tests-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: budget_app
          MYSQL_USER: budget_user
          MYSQL_PASSWORD: budget_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PORT: 4100
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: budget_user
      DB_PASSWORD: budget_password
      DB_NAME: budget_app
      JWT_ACCESS_SECRET: ci_access_secret_change_me
      JWT_REFRESH_SECRET: ci_refresh_secret_change_me
      ALLOWED_ORIGINS: http://localhost:5173
      JSON_BODY_LIMIT: 512kb
      GRAPHQL_MAX_RECURSIVE_SELECTIONS: 30
      GRAPHQL_INTEGRATION_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server install, tests, and build
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build

      - name: Start server and smoke check /health
        working-directory: server
        run: |
          npm run start > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4100/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          grep '"ok":true' /tmp/health.json
